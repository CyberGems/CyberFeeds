<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' data: https: blob:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https:;" />
    <title>CyberFeeds</title>
    <!-- Prevent white flash before CSS/theme hydrate. Synced with AppSettings.theme via localStorage. -->
    <style>
      html, body { margin: 0; background-color: #0d1117; color-scheme: dark; }
      html[data-theme="light"], html[data-theme="light"] body { background-color: #f6f8fa; color-scheme: light; }
      html[data-theme="grayscale"], html[data-theme="grayscale"] body { background-color: #18181b; }
      html[data-theme="dracula"], html[data-theme="dracula"] body { background-color: #282a36; }
      html[data-theme="nord"], html[data-theme="nord"] body { background-color: #2e3440; }
      html[data-theme="monokai"], html[data-theme="monokai"] body { background-color: #272822; }
    </style>
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
