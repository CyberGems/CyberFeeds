ShortDescription: Private feed reader for websites, YouTube and Reddit
Description: CyberFeeds brings updates from the websites, YouTube channels and Reddit communities you follow into one desktop app. Add RSS or Atom feeds, or import your subscriptions from an OPML file. Catch up in a focused reader, find articles later with search, and choose which new posts deserve a notification. Folders, favorites and read states help you stay organized, while scheduled backups to a folder you choose and a local SQLite database keep your library on your PC without an account. Built with Electron.
